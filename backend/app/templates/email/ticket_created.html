{% extends "base.html" %}
{% block content %}
<p style="margin:0 0 8px;">تیکت جدیدی ثبت شد. کارشناسان ما در اسرع وقت آن را بررسی خواهند کرد.</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;margin:12px 0;">
  <tr><td style="padding:12px 16px;font-size:13px;">
    <div><strong>شماره تیکت:</strong> {{ ticket_code }}</div>
    <div><strong>موضوع:</strong> {{ subject_line }}</div>
    {% if status %}<div><strong>وضعیت:</strong> {{ status }}</div>{% endif %}
    {% if priority %}<div><strong>اولویت:</strong> {{ priority }}</div>{% endif %}
  </td></tr>
</table>

{% endblock %}
